[package]
name = "neumannarch-server"
version.workspace = true
edition.workspace = true
description = "The match server of Neumannarch: rooms, lobby authority and forwarding"

[[bin]]
name = "neumannarch-server"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
neumannarch-protocol = { path = "../protocol" }
neumannarch-sim = { path = "../sim" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true
